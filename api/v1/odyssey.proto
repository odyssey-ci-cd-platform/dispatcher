syntax = "proto3";

package odyssey.v1;

option go_package = "github.com/odyssey-ci-cd-platform/dispatcher/gen/proto/v1;odysseyv1";

// Status represents the status of any pipeline entity.
enum Status {
  STATUS_UNSPECIFIED = 0;
  STATUS_PENDING = 1;
  STATUS_RUNNING = 2;
  STATUS_PASSED = 3;
  STATUS_FAILED = 4;
  STATUS_SKIPPED = 5;
  reserved 6; // was a transient STATUS_ERROR spelling; never released.
  STATUS_ERRORED = 7;
}

// RunPipelineRequest is sent by the client to trigger a pipeline run.
message RunPipelineRequest {
  // Absolute or relative path to the directory containing .odyssey/
  string project_path = 1;
}

// RunPipelineResponse is returned once the pipeline has finished.
message RunPipelineResponse {
  string pipeline_name = 1;
  Status status = 2;
  repeated StageResult stage_results = 3;
  int64 duration_ms = 4;
}

message JobResult {
  string job_name = 1;
  Status status = 2;
  repeated StepResult step_results = 3;
  // Setup or run error text; empty when the job itself did not fault.
  string error = 4;
  int64 duration_ms = 5;
}

message StageResult {
  string stage_name = 1;
  Status status = 2;
  repeated JobResult job_results = 3;
  int64 duration_ms = 4;
}

message StepResult {
  string step_name = 1;
  reserved 2; // was `output`: stdout and stderr merged; split per AUD-004.
  int32 exit_code = 3;
  Status status = 4;
  string stdout = 5;
  string stderr = 6;
  // Infrastructure fault text; empty for process failures, which speak
  // through exit_code instead.
  string error = 7;
  int64 duration_ms = 8;
}

// OdysseyService is the core daemon service.
service OdysseyService {
  // RunPipeline executes a pipeline and returns the full result when done.
  rpc RunPipeline(RunPipelineRequest) returns (RunPipelineResponse);
}
