---
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read # the workflow only reads the repo; no writes

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0 # check-docs.sh diffs against origin/main
          persist-credentials: false # the job only reads; no pushes
      # actions/setup-go v5
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
      - name: docs check
        run: .agents/bin/check-docs.sh origin/main
      - run: make check
      - name: race detector
        run: go test -race ./...
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          "$(go env GOPATH)/bin/govulncheck" ./...
