---
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read # the workflow only reads the repo; no writes

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # check-docs.sh diffs against origin/main
          persist-credentials: false # the job only reads; no pushes
      # actions/setup-go v5
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: go.mod
      - name: docs check
        run: .agents/bin/check-docs.sh origin/main
      - run: make check
      - name: race detector
        run: go test -race ./...
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          "$(go env GOPATH)/bin/govulncheck" ./...
