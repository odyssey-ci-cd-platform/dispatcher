version: 2
updates:
  # gomod: Dependabot bumps go.mod/go.sum in the root module.
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
  # github-actions: bumps the SHA pins in ci.yml, version comments included.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
